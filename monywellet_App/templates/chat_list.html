<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container bg-white min-vh-100 p-0 shadow-sm" style="max-width: 576px;">
        <div class="bg-primary p-3 text-white d-flex align-items-center gap-3">
            <a href="{{ url_for('home') }}" class="text-white"><i class="bi bi-arrow-left fs-4"></i></a>
            <h5 class="m-0 fw-bold">Chats</h5>
        </div>
        
        <div class="p-3">
            {% if chats %}
                <div class="list-group">
                    {% for chat in chats %}
                        {% set filename = chat.profile_pic if chat.profile_pic else 'default.png' %}
                        <a href="{{ url_for('chat_room', receiver_id=chat.user_id) }}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 p-3 border-0 border-bottom">
                            <img src="{{ url_for('static', filename='uploads/profile_pics/' + (profile_pic if profile_pic else 'default.png')) }}" 
                                onerror="this.src='{{ url_for('static', filename='images/logo.png') }}';" 
                                class="rounded-circle border" width="40" height="40" style="object-fit: cover;">
                            <div>
                                <h6 class="mb-0 fw-bold text-dark">{{ chat.user_id }}</h6>
                                <small class="text-muted">Click to send a message</small>
                            </div>
                        </a>
                    {% endfor %}
                </div>
            {% else %}
                <div class="text-center my-5 text-muted">
                    <i class="bi bi-chat-square-text fs-1"></i>
                    <p class="mt-2">No active chats found.</p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
