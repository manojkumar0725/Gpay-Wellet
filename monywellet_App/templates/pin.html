<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Security PIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .pin-container { max-width: 400px; margin-top: 100px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center ">
        <div class="pin-container text-center w-100">
            <div class="d-flex justify-content-start mb-3">
                <a href="{{ url_for('home') }}" class="text-decoration-none text-dark">
                    <i class="bi bi-arrow-left fs-3"></i>
                </a>
            </div>  
                <div class="d-flex justify-content-center align-items-center  mb-3">
                    <i class="bi bi-shield-lock-fill text-primary fs-1 text-center mb-2"></i>                           
                </div>

                <h4 class="mb-4">{{ trans('enter_pin') }}</h4>
            <div id="error-msg" class="alert alert-denger text-center small py-2 d-none" role="alert"></div>
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-danger text-ceter small py-2" role="alert">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            

            <form id="pinForm" >
                <input type="hidden" name="receiver_id" value="{{ receiver_id }}">
                <input type="hidden" name="amount" value="{{ amount }}">
                <div class="mb-4">
                    <input type="password" id="pinInput" class="form-control form-control-lg text-center letter-spacing-2" 
                           maxlength="4" pattern="\d{4}" placeholder="••••" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">{{ trans('verify_proceed') }}</button>
            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/pin.js') }}?v=1.1"></script>
</body>
</html>
