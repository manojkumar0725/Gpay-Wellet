<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Security PIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .pin-container { max-width: 400px; margin-top: 100px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="pin-container text-center w-100">
            <div class="d-flex justify-content-start mb-3">
                <a href="{{ url_for('tranfer') }}" class="text-decoration-none text-dark">
                    <i class="bi bi-arrow-left fs-3"></i>
                </a>
            </div>  
            
            <div class="mb-2">
                <i class="bi bi-shield-lock-fill text-primary fs-1"></i>                           
            </div>

            <h4 class="mb-3">{{ trans('enter_pin') }}</h4>
            
            <p class="text-muted small">Sending money to: <strong>{{ receiver_id }}</strong></p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  {% if category == 'danger' %}
                    <div class="alert alert-danger text-center small py-2" role="alert">
                      {{ message }}
                    </div>
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endwith %}
            
            <form id="TransferpinForm" action="{{ url_for('transfer_logic') }}" method="POST"> 
                <input type="hidden" name="receiver_id" value="{{ receiver_id }}">
                <input type="hidden" name="amount" value="{{ amount }}">               
                
                <div class="mb-4">
                    <input type="password" id="pinInput" name="pin" class="form-control form-control-lg text-center fs-3" 
                           maxlength="4" pattern="\d{4}" placeholder="••••" required autocomplete="off" autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">{{ trans('verify_proceed') }}</button>
                <a href="{{ url_for('tranfer') }}" class="btn btn-link text-secondary w-100 mt-2 text-decoration-none">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
