<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="A new web page">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="favicon.ico">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container  ">
    <div class="row d-flex justify-content-center align-items-center vh-100 "> 
      <div class="card p-2 col-12 col-md-6 col-lx-6">
        <div class="d-flex justify-content-between align-items-center">
          <h1 class="text-primary ">{{ trans('welcome_wallet') }}</h1>
          <div>
            <a href="{{ url_for('set_language', lang='en') }}" class="me-2 {% if current_lang == 'en' %}fw-bold{% endif %}">{{ trans('lang_english') }}</a>
            |
            <a href="{{ url_for('set_language', lang='ta') }}" class="ms-2 {% if current_lang == 'ta' %}fw-bold{% endif %}">{{ trans('lang_tamil') }}</a>
          </div>
        </div>
        <p class="">Hello</p>
          <form id="Num_Reg">
            <div class="input-group p-2">
              <input type="number" id="number" class="form-control" aria-describedby="button-addon2" placeholder="{{ trans('enter_mobile_number') }}">
              <button type="submit" class="btn" id="button-addon2"><i class="bi bi-send-arrow-up-fill"></i></button>
            </div>
          </form>
          <!--<img src="Num_imag.jpg" alt="image Num_imag" width="370px"> -->
          <img src="{{ url_for('static', filename='images/Num_imag.jpg') }}" width="100">
      </div>
    </div>
  </div>
  
  <script>
    const Numbers = document.getElementById("Num_Reg");
    Numbers.addEventListener("submit",(e)=>{
      e.preventDefault();
      const number = document.getElementById("number").value;
      if(number.length !== 10){
        alert("{{ trans('enter_10_digits') }}");
        return;
      }
      localStorage.setItem("user",Numbers);
      alert("success");
      window.location.href="loginpage.html";
    });
  </script>
</body>
</html>
